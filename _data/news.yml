# New entries use the JHU publication date, SafeRoads kickoff date, and NSF award date.
- date: "2026-11-11"
  title: "GenAI copilots for transportation decision-making"
  summary: "With support from the NSF and National Academies, Dr. Hao Frank Yang is developing engineered AI copilots that combine transportation evidence, established models, and simulation tools to help agencies explore alternatives and make informed planning decisions."
  url: "https://engineering.jhu.edu/case/news/civil-and-systems-engineering-experts-to-develop-genai-system-for-transportation-decision-making/"
  image: "/assets/images/news/genai-jhu-hao-frank-yang.webp"
  image_alt: "Dr. Hao Frank Yang, featured in the JHU news article"

- date: "2026-09-14"
  title: "SafeRoads AI advances road safety with Google.org support"
  summary: "As technical lead of SafeRoads AI, Dr. Hao Frank Yang is helping develop a platform that combines multimodal municipal data and agentic AI to support road safety decisions. Supported by Google.org, the project works with city partners to identify risks and evaluate safety improvements with human oversight."
  url: "https://saferoadsai.org/"
  image: "/assets/images/news/saferoads-google-kickoff.jpg"
  image_alt: "SafeRoads AI team at the Google.org kickoff in Washington, DC"

- date: "2026-08-05"
  title: "NSF award supports AI-driven traffic safety research"
  summary: "Dr. Hao Frank Yang has received an NSF CDS&E award to develop the SafeTraffic Decision Copilot. The project combines multimodal foundation models, data utility theory, and uncertainty-aware analysis to predict crash risks, explain contributing factors, and recommend targeted safety interventions."
  url: "https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2552612"
  image: "/assets/images/news/nsf-official-logo.png"
  image_alt: "U.S. National Science Foundation official logo"
  image_fit: contain

